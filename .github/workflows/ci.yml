name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install deps
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: unit tests
        run: bun test
      - name: install ffmpeg (scripts/install-deps.sh)
        run: bash scripts/install-deps.sh --check || bash scripts/install-deps.sh --yes
      - name: doctor
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/montash/ffmpeg/bin:$PATH"
          bun run dev doctor --json | tee doctor.json
          bun -e 'const j = await Bun.file("doctor.json").json(); if (!j.ok) { console.error(JSON.stringify(j.error)); process.exit(1) }'
