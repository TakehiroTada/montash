name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + lint + unit + e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install deps
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: lint (biome)
        run: bun run lint
      # ffmpeg はユニットテスト（probe / run / render）にも必要なので、テストより前に導入する
      - name: install ffmpeg (scripts/install-deps.sh)
        run: |
          bash scripts/install-deps.sh --check || bash scripts/install-deps.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/montash/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: doctor
        run: |
          bun run dev doctor --json | tee doctor.json
          bun -e 'const j = await Bun.file("doctor.json").json(); if (!j.ok) { console.error(JSON.stringify(j.error)); process.exit(1) }'
      - name: unit tests
        run: bun test
      - name: workflow e2e
        run: bash tests/workflows/run-all.sh
